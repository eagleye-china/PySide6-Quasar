[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pyside6-quasar"
version = "0.1.0"
description = "The Quasar Framework for PySide6 — Material Design components, pure QPainter, zero QSS."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
    { name = "Your Name", email = "you@example.com" },
]
keywords = [
    "pyside6", "qt6", "material-design", "quasar",
    "ui-framework", "desktop", "qpainter",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Framework :: PySide6",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: User Interfaces",
    "Typing :: Typed",
]
dependencies = [
    "PySide6>=6.6",
    "typing-extensions>=4.0; python_version<'3.11'",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-qt>=4.2",
    "pytest-cov>=4.1",
    "mypy>=1.5",
    "ruff>=0.1.0",
    "black>=23.9",
    "pre-commit>=3.4",
    "import-linter>=2.0",
]
docs = [
    "mkdocs-material>=9.4",
    "mkdocstrings[python]>=0.24",
    "mkdocs-gen-files>=0.5",
]

[project.urls]
Homepage = "https://github.com/your-org/pyside6-quasar"
Documentation = "https://your-org.github.io/pyside6-quasar"
Repository = "https://github.com/your-org/pyside6-quasar"
Issues = "https://github.com/your-org/pyside6-quasar/issues"
Changelog = "https://github.com/your-org/pyside6-quasar/blob/main/CHANGELOG.md"

# ═══ src-layout 关键配置 ═══
[tool.setuptools]
package-dir = { "" = "src" }
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyside6_quasar*"]
exclude = ["tests*", "examples*", "docs*"]

[tool.setuptools.package-data]
pyside6_quasar = [
    "py.typed",
    "assets/**/*.svg",
    "assets/**/*.ttf",
    "core/i18n/locales/*.json",
]

# ═══ 代码规范 ═══
[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = false

# ═══ 测试 ═══
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
qt_api = "pyside6"

[tool.coverage.run]
source = ["src/pyside6_quasar"]
branch = true
